<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>I'm Ping Pong King — web port</title>
<link rel="stylesheet" href="app.css">
<div id="wrap"><div id="stage"></div></div>
<div id="boot">loading…</div>
<pre id="errs" hidden></pre>
<script>
/* every uncaught error and rejection lands in #errs, so the headless harness
   can see a broken build instead of quietly screenshotting a blank stage */
window.__errs = [];
function __logErr(m) { window.__errs.push(m);
  var e = document.getElementById("errs"); if (e) e.textContent = window.__errs.join("\n"); }
addEventListener("error", function (e) {
  __logErr("ERR " + (e.filename||"").split("/").pop() + ":" + e.lineno + " " + (e.message||e.error)); });
addEventListener("unhandledrejection", function (e) { __logErr("REJ " + e.reason); });
</script>
